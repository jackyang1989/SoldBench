components:
  securitySchemes:
    SupportReceipt:
      type: apiKey
      in: header
      name: X-Support-Receipt
      description: Private random capability for one support request status, valid during its retention period.
    OfflinePayPalFixtureSignature:
      type: apiKey
      in: header
      name: X-SoldBench-Fixture-PayPal-Signature
      description: Local simulator only. Not a PayPal vendor credential.
    OfflinePayPalFixtureTime:
      type: apiKey
      in: header
      name: X-SoldBench-Fixture-PayPal-Time
      description: Local fixture timestamp, paired with the local fixture signature.
    ApiKey:
      type: http
      scheme: bearer
      description: Opaque SoldBench API key, hash stored server side.
    Session:
      type: apiKey
      in: cookie
      name: soldbench_session
    PaddleSignature:
      type: apiKey
      in: header
      name: Paddle-Signature
      description: Verify original bytes using selected official Paddle SDK; enforce timestamp and environment.
    DodoSignature:
      type: apiKey
      in: header
      name: webhook-signature
      description: Standard Webhooks signature over webhook-id, webhook-timestamp and original bytes.
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Verify raw body and signed timestamp using official SDK and environment-specific secret.
    PayPalSignature:
      type: apiKey
      in: header
      name: paypal-transmission-sig
      description: Verify complete transmission headers against the configured official verification service and webhook ID; never trust arbitrary cert URLs.
    DeletionReceipt:
      type: apiKey
      in: header
      name: X-Deletion-Receipt
      description: Hash-stored capability limited to a deletion request status; expires in 30 days.
  schemas:
    SupportReceiptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            request_id: *id002
            status: &support_state {enum: [received, in_progress, resolved, closed]}
            reply: &support_reply {type: [string, 'null'], maxLength: 2000}
            updated_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
          required: [request_id, status, reply, updated_at, expires_at]
          additionalProperties: false
        meta: {$ref: '#/components/schemas/BasicMeta'}
      required: [data, meta]
      additionalProperties: false
    SupportQueueResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: *id002
                  category: {enum: [data_quality, takedown, billing, account, other]}
                  status: *support_state
                  version: {type: integer, minimum: 1}
                  assigned_to_you: {type: boolean}
                  can_take_over: {type: boolean}
                  assignee_ref: {type: [string, 'null']}
                  due_at: {type: [string, 'null'], format: date-time}
                  created_at: {type: string, format: date-time}
                required: [id, category, status, version, assigned_to_you, can_take_over, assignee_ref, due_at, created_at]
                additionalProperties: false
            next_cursor: {type: [string, 'null']}
          required: [items, next_cursor]
          additionalProperties: false
        meta: {$ref: '#/components/schemas/BasicMeta'}
      required: [data, meta]
      additionalProperties: false
    SupportDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message: {type: string, minLength: 1, maxLength: 4000}
            related_request_id: {type: [string, 'null'], format: uuid}
            reply: *support_reply
          required: [message, related_request_id, reply]
          additionalProperties: false
        meta: {$ref: '#/components/schemas/BasicMeta'}
      required: [data, meta]
      additionalProperties: false
    SupportCommand:
      oneOf:
      - type: object
        properties:
          command: {enum: [claim, take_over, reopen]}
          due_at: {type: string, format: date-time, pattern: 'Z$'}
          reason: &support_reason {type: string, minLength: 1, maxLength: 1000}
          version: &support_version {type: integer, minimum: 1}
        required: [command, due_at, reason, version]
        additionalProperties: false
      - type: object
        properties:
          command: {const: resolve}
          reply: {type: string, minLength: 1, maxLength: 2000}
          reason: *support_reason
          version: *support_version
        required: [command, reply, reason, version]
        additionalProperties: false
      - type: object
        properties:
          command: {const: close}
          reason: *support_reason
          version: *support_version
        required: [command, reason, version]
        additionalProperties: false
    BasicMeta:
      type: object
      properties:
        request_id:
          type: string
          minLength: 1
        credits_charged:
          type: integer
          minimum: 0
          maximum: 1
      required:
