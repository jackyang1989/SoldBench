    SiteContentDraft:
      type: object
      properties:
        command: {const: draft}
        kind: &site_content_kind
          type: string
          enum: [announcement, faq, guide, blog, home, navigation, footer, pricing_copy, billing_copy,
                 offer_copy, category_copy, comparison, changelog, status_copy, status_component,
                 status_incident, about, terms, privacy]
        slug: &site_slug {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 70}
        version: {type: integer, minimum: 0}
        body: {$ref: '#/components/schemas/BilingualSiteText'}
        metadata: &site_metadata
          type: object
          properties:
            author: {type: string, minLength: 1, maxLength: 120}
            related: {type: array, maxItems: 6, items: *site_slug}
            position: {type: integer, minimum: 0, maximum: 1000}
            target:
              enum: [/, /search, /research, /pricing, /categories, /guides, /blog, /faq, /methodology,
                     /data-availability, /support, /docs, /agents, /about, /changelog]
            reference: {type: string, format: uri, pattern: '^https://[^/@]+(?:[/?#]|$)', maxLength: 500}
            reference_key: *site_slug
            policy_version: {type: string, minLength: 1, maxLength: 120}
          additionalProperties: false
        reason: &site_reason {type: string, minLength: 1, maxLength: 500}
      required: [command, kind, slug, version, body, reason]
      additionalProperties: false
      allOf:
      - if: {properties: {kind: {enum: [announcement, faq, about]}}}
        then:
          properties:
            metadata: {maxProperties: 0}
      - if: {properties: {kind: {enum: [guide, blog]}}}
        then:
          properties:
            metadata:
              propertyNames: {enum: [author, related]}
      - if: {properties: {kind: {enum: [home]}}}
        then:
          properties:
            metadata:
              propertyNames: {enum: [position, target]}
      - if: {properties: {kind: {enum: [navigation, footer]}}}
        then:
          required: [metadata]
          properties:
            metadata:
              propertyNames: {enum: [position, target]}
              required: [target]
      - if: {properties: {kind: {enum: [pricing_copy, billing_copy, category_copy, status_copy]}}}
        then:
          properties:
            metadata:
              propertyNames: {enum: [position]}
      - if: {properties: {kind: {enum: [offer_copy, status_component]}}}
        then:
          required: [metadata]
          properties:
            metadata:
              propertyNames: {enum: [position, reference_key]}
              required: [reference_key]
      - if: {properties: {kind: {enum: [comparison]}}}
        then:
          required: [metadata]
          properties:
            metadata:
              propertyNames: {enum: [position, reference]}
              required: [reference]
      - if: {properties: {kind: {enum: [changelog]}}}
        then:
          properties:
            metadata:
              propertyNames: {enum: [reference]}
      - if: {properties: {kind: {enum: [status_incident]}}}
        then:
          required: [metadata]
          properties:
            metadata:
              propertyNames: {enum: [reference_key]}
              required: [reference_key]
      - if: {properties: {kind: {enum: [terms, privacy]}}}
        then:
          required: [metadata]
          properties:
            metadata:
              propertyNames: {enum: [policy_version, reference]}
              required: [policy_version]
