openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SoldBench API — offline implementation contract
  version: 1.5.0
  description: Design baseline 2026-11-16. No service is deployed. Production source access and payment approvals remain external
    gates. All fixtures are synthetic.
x-payment-policy:
  primary: stripe
  supplemental: paypal
  reserve_qualification: [creem, dodo]
  automatic_fallback: false
  activation: Requires real account/product approval, reconciliation and applicable release gates.
x-i18n-policy:
  supported_ui_locales: [en, zh-CN]
  default_locale: en
  json_messages: English; Web maps stable code/details to localized messages.
  notifications: Resolve Accept-Language on enqueue; freeze locale and translation_revision in outbox payload.
  invariants: Language never changes marketplace, USD, query identity, permissions or billing.
servers:
- url: http://localhost:3000
  description: Local future implementation only; not currently running
security:
- ApiKey: []
paths:
  /v1/media/{image_id}:
    get:
      operationId: getPrimaryImage
      x-task: TASK-028
      x-roles: [owner]
      x-credit-policy: 0; this read only serves an authorized stored image and never triggers a sold search.
      security:
      - ApiKey: []
      - Session: []
      summary: Read an owner-authorized normalized image rendition after checking current source rights.
      description: Returns only the SoldBench-generated rendition, never redirects to an upstream image. Current collection, storage, display, owner and permission-epoch checks run on every read. Unauthorized/unknown objects are indistinguishable. Response is private and no-store.
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: Optional presentation language preference; does not affect image identity or permissions.
        schema:
          type: string
          maxLength: 256
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current-rights permitted normalized primary image.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown, unauthorized, expired or revoked image; these cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
