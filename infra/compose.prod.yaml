services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "listen_addresses=", "-c", "hba_file=/etc/soldbench/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      POSTGRES_USER: ${POSTGRES_USER:-soldbench_bootstrap}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap
    secrets:
      - db_bootstrap
    networks:
      - internal
    volumes:
      - soldbench_pgdata:/var/lib/postgresql/data
      - soldbench_pgsocket:/var/run/postgresql
      - ./db/pg_hba.conf:/etc/soldbench/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(cat /proc/1/comm)" = postgres && pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  db-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/opt/soldbench/db/provision.sh"]
    user: postgres
    read_only: true
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - soldbench_pgsocket:/var/run/postgresql:ro
      - ./db:/opt/soldbench/db:ro
    secrets:
      - db_bootstrap
      - db_migrator
      - db_runtime
      - db_collector
      - db_backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      POSTGRES_USER: ${POSTGRES_USER:-soldbench_bootstrap}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.runtime
    command: ["node", "--import", "./scripts/container-database.mjs", "scripts/deploy-db.mjs"]
    volumes:
      - soldbench_pgsocket:/run/soldbench/postgres:ro
    secrets:
      - source: db_migrator
        target: db_password
    networks:
      - internal
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      SOLDBENCH_DATABASE_ROLE: soldbench_migrator
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://soldbench.test}
      SOLDBENCH_ISOLATED_DEPLOYMENT: ${SOLDBENCH_ISOLATED_DEPLOYMENT:-true}
      SOLDBENCH_LIVE_GATE_ACKNOWLEDGED: ${SOLDBENCH_LIVE_GATE_ACKNOWLEDGED:-false}
      COLLECTOR_ENABLED: "false"
      DATA_MODE: ${DATA_MODE:-offline_fixture}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-offline}
      DB_STARTUP_MODE: migrate

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.runtime
    command: ["node", "--import", "./scripts/container-database.mjs", "apps/api/dist/server.js"]
    networks:
      - edge
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - soldbench_pgsocket:/run/soldbench/postgres:ro
      - soldbench_media:/var/lib/soldbench/media:ro
    secrets:
      - source: db_runtime
        target: db_password
      - auth_bundle
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:-http://soldbench.test}
      NODE_ENV: production
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      SOLDBENCH_DATABASE_ROLE: soldbench_runtime
      SOLDBENCH_ISOLATED_DEPLOYMENT: ${SOLDBENCH_ISOLATED_DEPLOYMENT:-true}
      AUTH_SECRETS_FILE: /run/secrets/auth_bundle
      AUTH_SECRETS_VERSION: ${AUTH_SECRETS_VERSION:-initial}
      DB_STARTUP_MODE: verify
      SOLDBENCH_LIVE_GATE_ACKNOWLEDGED: ${SOLDBENCH_LIVE_GATE_ACKNOWLEDGED:-false}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      DATA_MODE: ${DATA_MODE:-offline_fixture}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-offline}
      PAYMENT_FIXTURES: ${PAYMENT_FIXTURES:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MERCHANT_ID: ${STRIPE_MERCHANT_ID:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MERCHANT_ID: ${PAYPAL_MERCHANT_ID:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-offline}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MEDIA_ROOT: /var/lib/soldbench/media

  query-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.runtime
    command: ["node", "--import", "./scripts/container-database.mjs", "scripts/query-worker.mjs", "--watch"]
    healthcheck:
      disable: true
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - soldbench_pgsocket:/run/soldbench/postgres:ro
      - soldbench_media:/var/lib/soldbench/media:ro
    secrets:
      - source: db_runtime
        target: db_password
      - auth_bundle
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      SOLDBENCH_DATABASE_ROLE: soldbench_runtime
      DB_STARTUP_MODE: verify
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://soldbench.test}
      SOLDBENCH_ISOLATED_DEPLOYMENT: ${SOLDBENCH_ISOLATED_DEPLOYMENT:-true}
      AUTH_SECRETS_FILE: /run/secrets/auth_bundle
      AUTH_SECRETS_VERSION: ${AUTH_SECRETS_VERSION:-initial}
      SOLDBENCH_LIVE_GATE_ACKNOWLEDGED: ${SOLDBENCH_LIVE_GATE_ACKNOWLEDGED:-false}
      COLLECTOR_ENABLED: "false"
      DATA_MODE: ${DATA_MODE:-offline_fixture}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-offline}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-offline}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MEDIA_ROOT: /var/lib/soldbench/media

  collector-supervisor:
    profiles: ["collector"]
    command: ["node", "--import", "./scripts/container-database.mjs", "scripts/collector-supervisor.mjs", "--source=${COLLECTOR_SOURCE_ID:-unconfigured}", "--watch=true"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.collector
    # Strictly separated from edge HTTP proxy and auth/payment secrets.
    networks:
      - internal
      - collector_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,nosuid
    volumes:
      - soldbench_pgsocket:/run/soldbench/postgres:ro
      - soldbench_media:/var/lib/soldbench/media
      - soldbench_spool:/var/lib/soldbench/spool
    secrets:
      - source: db_collector
        target: db_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldbench}
      SOLDBENCH_DATABASE_ROLE: soldbench_collector
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://soldbench.test}
      SOLDBENCH_ISOLATED_DEPLOYMENT: ${SOLDBENCH_ISOLATED_DEPLOYMENT:-true}
      DB_STARTUP_MODE: verify
      SOLDBENCH_LIVE_GATE_ACKNOWLEDGED: ${SOLDBENCH_LIVE_GATE_ACKNOWLEDGED:-false}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      DATA_MODE: ${DATA_MODE:-offline_fixture}
      COLLECTOR_PROXY_URL: ${COLLECTOR_PROXY_URL:-}
      PAYMENTS_MODE: "offline"
      MEDIA_ROOT: /var/lib/soldbench/media
      COLLECTOR_DEMO_DIR: /var/lib/soldbench/spool
      SOLDBENCH_BROWSER_BINARY: /usr/bin/chromium

  caddy:
    image: caddy:2.9-alpine
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    environment:
      SOLD_SITE_ADDRESS: ${SOLD_SITE_ADDRESS:-http://soldbench.test}
      SOLD_API_ADDRESS: ${SOLD_API_ADDRESS:-http://api.soldbench.test}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 15s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - soldbench_caddy_data:/data
      - soldbench_caddy_config:/config

networks:
  edge:
    driver: bridge
    internal: true
  internal:
    driver: bridge
    internal: true
  collector_egress:
    driver: bridge
    internal: true

volumes:
  soldbench_pgdata:
  soldbench_pgsocket:
  soldbench_media:
  soldbench_spool:
  soldbench_caddy_data:
  soldbench_caddy_config:

secrets:
  db_bootstrap:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/db-bootstrap
  db_migrator:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/db-migrator
  db_runtime:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/db-runtime
  db_collector:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/db-collector
  db_backup:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/db-backup
  auth_bundle:
    file: ${SOLDBENCH_SECRETS_DIR:-./.secrets}/auth-bundle.json
