# Explicit production overlay. Only the edge publishes host ports.
x-formal-runtime: &formal-runtime
  SOLDBENCH_ISOLATED_DEPLOYMENT: "false"
  APP_ORIGIN: https://soldbench.com
services:
  migrate:
    environment: *formal-runtime
  api:
    environment: *formal-runtime
  query-worker:
    environment: *formal-runtime
  collector-supervisor:
    environment: *formal-runtime
  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      SOLD_SITE_ADDRESS: soldbench.com
      SOLD_API_ADDRESS: api.soldbench.com
    depends_on:
      api:
        condition: service_healthy
networks:
  edge:
    internal: false
  collector_egress:
    internal: false
