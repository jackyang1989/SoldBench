services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: soldbench
      POSTGRES_USER: soldbench
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["soldbench-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soldbench -d soldbench"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
volumes:
  soldbench-postgres:
